[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-skeleton-python-refactor"
version = "0.96.0"
description = "A public Maya-first Python refactor of rig behavior with a portable DCC-independent core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "All rights reserved" }
authors = [{ name = "Ubik" }]
dependencies = []

[project.scripts]
adv-migrate = "adv_migration.cli:main"
adv-rig = "adv_py.product.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
